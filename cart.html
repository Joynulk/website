<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Tiro+Bangla&display=swap" rel="stylesheet"><link rel="stylesheet" href="mela.css"><title>কার্ট — মেলা</title></head><body>
<header id="hd"></header>
<main><h2>আপনার কার্ট</h2><div id="lines"></div>
<div class="sum"><div><span>পণ্যের দাম</span><span id="sub"></span></div><div><span>ডেলিভারি (২০০০ টাকার নিচে)</span><span id="ship"></span></div><div class="t"><span>মোট</span><span id="tot"></span></div></div>
<h2>ডেলিভারির ঠিকানা</h2>
<p class="note" id="lg"></p>
<form id="f"><label for="nm">নাম</label><input id="nm" required autocomplete="name">
<label for="ph">মোবাইল নম্বর</label><input id="ph" required inputmode="numeric" pattern="01[3-9][0-9]{8}" title="১১ সংখ্যার বাংলাদেশি নম্বর, যেমন 017XXXXXXXX" autocomplete="tel">
<label for="ad">পূর্ণ ঠিকানা</label><textarea id="ad" rows="3" required minlength="5" autocomplete="street-address"></textarea>
<label class="chk"><input type="checkbox" id="sv" checked> পরের বার জন্য আমার তথ্য মনে রাখুন</label>
<p class="note" id="err" role="alert" style="color:var(--red)"></p>
<button class="btn" id="go" type="submit">অর্ডার নিশ্চিত করুন (ক্যাশ অন ডেলিভারি)</button></form></main>
<footer id="ft"></footer>
<script src="mela.js"></script>
<script>
const {P,VAR,$,bn,tk,esc}=Mela;Mela.header("cart");
let L=Mela.cartLines();
const LABEL="অর্ডার নিশ্চিত করুন (ক্যাশ অন ডেলিভারি)";
const fee=s=>s&&s<2000?60:0;
const u=Mela.user();if(u){$("nm").value=u.name||"";$("ph").value=u.phone||"";$("ad").value=u.addr||""}
const ses=Mela.session();
if(ses&&ses.user)$("lg").textContent="লগইন আছে: "+ses.user.email+" — অর্ডারটি আপনার অ্যাকাউন্টে যোগ হবে।";
else $("lg").innerHTML='লগইন ছাড়াও অর্ডার করা যাবে। <a href="account.html">লগইন করলে</a> অর্ডার ইতিহাস সব ডিভাইসে দেখতে পারবেন।';
function draw(){
  L=L.filter(l=>l.q>0);Mela.set("mela_cart",L);Mela.refreshBadge();
  const sub=L.reduce((s,l)=>s+l.pr*l.q,0),sh=fee(sub);
  $("lines").innerHTML=L.length?L.map((l,i)=>`<div class="row"><i>${esc(l.e)}</i><div>${esc(l.n)}<br><small>${tk(l.pr)}</small></div><button data-m="${i}" aria-label="কমান">−</button><b>${bn(l.q)}</b><button data-p="${i}" aria-label="বাড়ান">+</button></div>`).join(""):'<p class="empty">কার্ট খালি। <a href="shop.html">কেনাকাটা শুরু করুন</a></p>';
  $("sub").textContent=tk(sub);$("ship").textContent=sh?tk(sh):"বিনামূল্যে";$("tot").textContent=tk(sub+sh);$("go").disabled=!L.length;
}
/* keep the cart equal to the shop: current prices, no products that are gone.
   With fresh data (fresh=true) quantities are also cut down to the stock left. */
function sync(fresh){
  L=L.filter(l=>P.some(p=>p.id==l.k.split(":")[0]));
  L.forEach(l=>{const [i,v]=l.k.split(":"),p=P.find(x=>x.id==i);l.pr=p.p+(VAR[+v]||VAR[0]).x});
  if(fresh){
    const left={};P.forEach(p=>{if(p.s!=null)left[p.id]=p.s});
    L.forEach(l=>{const i=l.k.split(":")[0];if(left[i]!=null){l.q=Math.max(0,Math.min(l.q,left[i]));left[i]-=l.q}});
  }
  draw();
}
$("lines").onclick=e=>{const m=e.target.dataset.m,p=e.target.dataset.p;if(m!==undefined)L[m].q--;if(p!==undefined)L[p].q++;draw()};
function oops(m){
  if(/too many orders/.test(m))return"এই ফোন নম্বর থেকে ঘণ্টায় 3টির বেশি অর্ডার নেওয়া হয় না। কিছুক্ষণ পর আবার চেষ্টা করুন।";
  if(/out of stock/.test(m))return"কিছু পণ্যের stock এখন যথেষ্ট নেই। কার্ট ঠিক করে দেওয়া হয়েছে, আবার দেখে অর্ডার করুন।";
  if(/product not found/.test(m))return"কোনো পণ্য আর পাওয়া যাচ্ছে না। কার্ট ঠিক করে দেওয়া হয়েছে, আবার দেখুন।";
  return"অর্ডার পাঠানো যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।";
}
$("f").onsubmit=async e=>{
  e.preventDefault();if(!L.length)return;
  const btn=$("go"),msg=$("err");
  btn.disabled=true;btn.textContent="অর্ডার পাঠানো হচ্ছে…";msg.textContent="";
  const d={name:$("nm").value.trim(),phone:$("ph").value.trim(),addr:$("ad").value.trim()};
  try{
    const r=await Mela.placeOrder(d,L);
    const o={id:r.id,name:d.name,phone:d.phone,addr:d.addr,lines:L,total:r.total,date:new Date().toISOString(),status:"প্রক্রিয়াধীন"};
    Mela.addOrder(o);Mela.set("mela_order",o);
    if($("sv").checked)Mela.saveProfile(d).catch(()=>{});
    try{localStorage.removeItem("mela_cart")}catch(err){}
    setTimeout(()=>{location.href="order-placed.html"},150);
  }catch(err){
    msg.textContent=oops(err.message);
    if(/out of stock|product not found/.test(err.message)){try{await Mela.refresh();sync(true)}catch(x){}}
    btn.disabled=!L.length;btn.textContent=LABEL;
  }
};
sync(false);
Mela.load().then(ok=>{if(ok)sync(true)});
</script></body></html>
