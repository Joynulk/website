<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="mela.css"><title>মেলা — সব কিছুর মেলা, এক জায়গায়</title></head><body>
<header id="hd"></header>
<main class="bleed" id="main">
<section class="tile t-d hero"><h1>সব কিছুর মেলা,<br>এক জায়গায়</h1><p class="lead">দেশি শখের জিনিস, হাতের কাজ আর রোজকার প্রয়োজন।</p><div class="cta"><a class="btn" href="shop.html">কেনাকাটা শুরু করুন</a><a class="btn alt" href="#cats">দোকান ঘুরে দেখুন ›</a></div></section>
<div class="tiles" id="cats"></div>
<section class="sec"><div class="bar"><h2>জনপ্রিয় পণ্য</h2><a href="shop.html">সব পণ্য দেখুন ›</a></div><div class="grid" id="feat"></div></section>
<section class="t-p"><div class="perk3"><div><span aria-hidden="true">🚚</span><b>ক্যাশ অন ডেলিভারি</b><small>পণ্য হাতে পেয়ে টাকা দিন</small></div><div><span aria-hidden="true">🔁</span><b>৭ দিনে ফেরত</b><small>পছন্দ না হলে ফেরত দিন</small></div><div><span aria-hidden="true">🎁</span><b>২০০০ টাকায় ফ্রি ডেলিভারি</b><small>২০০০ টাকা বা তার বেশি কিনলে</small></div></div></section>
</main>
<footer id="ft"></footer>
<script src="mela.js"></script>
<script>
const {CATS,P,$,esc}=Mela;Mela.header("");
const shade=["t-l","t-d","t-p"];
function draw(){
  $("cats").innerHTML=CATS.filter(c=>c.id!=="all").map((c,i)=>`<a class="tile ${shade[i%3]}" href="shop.html?c=${encodeURIComponent(c.id)}"><span class="te" aria-hidden="true">${esc(c.e)}</span><h2>${esc(c.n)}</h2><span class="tl">দেখুন ›</span></a>`).join("");
  $("feat").innerHTML=P.slice(0,8).map(p=>Mela.card(p)).join("");
}
Mela.bindGrid($("feat"));
draw();
Mela.load().then(ok=>{if(ok)draw()});
</script></body></html>
