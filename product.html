<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet"><link rel="stylesheet" href="mela.css"><title>পণ্য — মেলা</title></head><body>
<header id="hd"></header>
<main class="wide" id="pg"></main>
<footer id="ft"></footer>
<script src="mela.js"></script>
<script>
const {CATS,P,VAR,$,bn,tk,tone}=Mela;Mela.header("shop");
const p=P.find(x=>x.id===+Mela.params().get("id"));
if(!p){
  $("pg").innerHTML='<p class="empty">পণ্যটি পাওয়া যায়নি। <a href="shop.html">দোকানে ফিরুন</a></p>';
  document.title="পণ্য নেই — মেলা";
}else{
  document.title=p.n+" — মেলা";
  const cat=CATS.find(c=>c.id===p.c);let vi=0,qty=1;
  $("pg").innerHTML=`<nav class="crumb" aria-label="পথ"><a href="index.html">হোম</a> › <a href="shop.html?c=${p.c}">${cat.n}</a> › ${p.n}</nav>
<div class="pd"><div class="pimg" style="background:${tone(p.c)}66" aria-hidden="true">${p.e}</div>
<div class="pinfo"><h1>${p.n}</h1><div class="pprice" id="pp"></div><p>${p.d}</p>
<div class="vs" id="vs" role="group" aria-label="ধরন">${VAR.map((v,i)=>`<button class="vr" data-i="${i}" aria-pressed="false">${v.n}${v.x?" +"+tk(v.x):""}</button>`).join("")}</div>
<div class="qr"><div class="qc"><button id="mm" aria-label="কমান">−</button><b id="mq">১</b><button id="mpl" aria-label="বাড়ান">+</button></div><b id="tot"></b></div>
<div class="acts"><button class="btn" id="addb">কার্টে যোগ করুন</button><button class="btn alt" id="buyb">এখনই কিনুন</button><button class="hrt big" id="wb" aria-label="প্রিয় তালিকা" aria-pressed="false">♡</button></div>
<ul class="perks"><li>🚚 ক্যাশ অন ডেলিভারি</li><li>🔁 ৭ দিনে ফেরত</li><li>🎁 ২০০০ টাকা বা তার বেশি কিনলে ডেলিভারি ফ্রি</li></ul></div></div>
<section id="rw"><h2>এই ধরনের আরও পণ্য</h2><div class="grid" id="rel"></div></section>`;
  const paint=()=>{
    const pr=p.p+VAR[vi].x;
    $("pp").textContent=tk(pr);$("tot").textContent=tk(pr*qty);$("mq").textContent=bn(qty);
    [...$("vs").children].forEach((b,i)=>{b.classList.toggle("on",i===vi);b.setAttribute("aria-pressed",i===vi)});
  };
  const wpaint=()=>{const on=Mela.isWish(p.id);$("wb").textContent=on?"♥":"♡";$("wb").setAttribute("aria-pressed",on)};
  $("vs").onclick=e=>{const b=e.target.closest("[data-i]");if(b){vi=+b.dataset.i;paint()}};
  $("mm").onclick=()=>{qty=Math.max(1,qty-1);paint()};
  $("mpl").onclick=()=>{qty=Math.min(20,qty+1);paint()};
  $("addb").onclick=()=>{Mela.addToCart(p.id,vi,qty);Mela.toast(p.n+" কার্টে যোগ হয়েছে")};
  $("buyb").onclick=()=>{Mela.addToCart(p.id,vi,qty);location.href="cart.html"};
  $("wb").onclick=()=>{Mela.toggleWish(p.id);wpaint()};
  const rel=P.filter(x=>x.c===p.c&&x.id!==p.id).slice(0,4);
  if(rel.length){$("rel").innerHTML=rel.map(x=>Mela.card(x)).join("");Mela.bindGrid($("rel"))}else $("rw").hidden=true;
  paint();wpaint();
}
</script></body></html>
