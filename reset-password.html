<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="mela.css"><title>নতুন পাসওয়ার্ড — মেলা</title></head><body>
<header id="hd"></header>
<main><h2>নতুন পাসওয়ার্ড দিন</h2>
<div id="bad" hidden><p><b>লিংকটি আর কাজ করছে না।</b></p><p class="note">লিংকের মেয়াদ শেষ হয়েছে, আগেই ব্যবহার হয়েছে, অথবা সবটা কপি হয়নি। নতুন লিংক চান।</p><a class="btn" href="forgot-password.html">নতুন লিংক চান</a></div>
<form id="rf" hidden><p class="note">কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন। সহজ বা আগেরটির মতো হলে চলবে না।</p>
<label for="np">নতুন পাসওয়ার্ড</label><input id="np" type="password" minlength="8" required autocomplete="new-password">
<label for="np2">আবার লিখুন</label><input id="np2" type="password" minlength="8" required autocomplete="new-password">
<label class="chk"><input type="checkbox" id="sp"> পাসওয়ার্ড দেখান</label>
<p class="note" id="msg" role="alert" style="color:var(--red)"></p>
<button class="btn" id="go" type="submit">পাসওয়ার্ড বদলান</button></form>
<div id="ok" hidden><p><b>পাসওয়ার্ড বদলেছে।</b></p><a class="btn" href="login.html">লগইন করুন</a></div></main>
<footer id="ft"></footer>
<script src="mela.js"></script>
<script>
const {$}=Mela;Mela.header("acc");
/* the reset token arrives in the #hash; keep it in memory and remove it from the address bar */
const hp=new URLSearchParams(location.hash.slice(1));
const tok=hp.get("type")==="recovery"?hp.get("access_token"):null;
history.replaceState(null,"",location.pathname);
if(tok)$("rf").hidden=false;else $("bad").hidden=false;
const msg=$("msg"),say=t=>{msg.textContent=t};
$("sp").onchange=e=>{const t=e.target.checked?"text":"password";$("np").type=t;$("np2").type=t};
const nice=m=>/different from the old|same as/i.test(m)?"নতুন পাসওয়ার্ড আগেরটির মতো হতে পারবে না।"
  :/weak|short|least|characters|password/i.test(m)?"পাসওয়ার্ড সহজ বা ছোট। কমপ্রে ৮ অক্ষরের ভালো পাসওয়ার্ড দিন।"
  :"কাজটি হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।";
$("rf").onsubmit=async e=>{
  e.preventDefault();say("");
  const a=$("np").value;
  if(a!==$("np2").value){say("দুটি পাসওয়ার্ড এক হয়নি।");return}
  const b=$("go");b.disabled=true;
  try{
    const u=await Mela.updatePassword(tok,a);
    try{await Mela.signIn(u.email,a);location.replace("account.html");return}catch(x){}
    $("rf").hidden=true;$("ok").hidden=false;return;
  }catch(err){
    if(/expired|invalid|jwt|session|not found/i.test(err.message)){$("rf").hidden=true;$("bad").hidden=false;return}
    say(nice(err.message));
  }
  b.disabled=false;
};
</script></body></html>
